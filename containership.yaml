version: "1.0"
services:
 web:
  image: nginx:latest
  depends_on: [db]
  ports:
   - "8080:80"
  volumes:
   - ./html:/usr/share/nginx/html
  restart: always
  command: ["nginx", "-g", "daemon off;"]
  env_file:
   - .env
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  replicas: 2
 db:
  image: postgres:15
  environment:
   POSTGRES_PASSWORD: defNotApi
  volumes:
   - db_data:/var/lib/postgresql/data
  restart: unless-stopped
 worker:
  image: busybox:latest
  depends_on: [db]
  command: ["sh", "-c", "while true; do echo hello; sleep 10; done"]
volumes:
  db_data: